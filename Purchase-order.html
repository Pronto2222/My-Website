<!DOCTYPE html>
<html>
 
<head>
    <title>My First Website</title>
</head>
   
<body>
    <h1 style="color: white; font-style: italic; font-size: 50px; background-color:Tomato; 
        height: 60px; text-align: left; padding: 20px 20px;">
        &nbspOrder Form
    </h1>
    
    <!----------------------- Java Script Emailing ---------------------------------->
    
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
        emailjs.init({
            publicKey: 'pAntPMq2pXYrghNvQ'
        });
    </script>
    
    <form id="order-form">
    <input type="hidden" id="date" name="date"> 
    <input type="hidden" id="email" name="email"> 
        
    <div>
        <a href="#" onclick="history.back(); return false;"
           style="color: black; font-weight: bold; font-size: 32px; text-decoration: none;">
           &lt; Back <br>
        </a>
        <br>
        
        <label for="From"
            style="font-size: 32px; color: blue; display: inline-block; width: 160px;">
            From:
        </label>

        <input type="text"
            name="From"
            id="From" 
            style="font-size: 32px; width: 750px;"
            placeholder="Your Name"
            required>
    </div>
    <br>

    <div>
        <label for="carboncopy"
            style="font-size: 32px; color: blue; display: inline-block; width: 160px;">
            Email:
        </label>

        <input type="email"
            name="carboncopy"
            id="carboncopy"
            style="font-size: 32px; width: 750px;"
            placeholder="Your Email if you require a copy"
            >
    </div>
    <br>

    <div>
        <label for="address"
            style="font-size: 32px; color: blue; vertical-align: top; display: inline-block; width: 160px;">
            Address:
        </label>
        
        <input type="text"
            id="address"
            name="address"
            style="font-size: 32px; width: 600px;"
            placeholder="Your Address"
            ><br>
        <input type="text"
            id="address2"
            name="address2"
            style="font-size: 32px; width: 750px; margin-left: 164px;"
            >
    </div><br>

    <div>
        <label for="message"
            style="font-size: 32px; color: blue; vertical-align: top; display: inline-block; width: 160px;">
            Message:
        </label>

        <textarea name="message"
            rows="5"
            style="font-size: 32px; width: 750px;"
            placeholder="Your Message"
            ></textarea>
    </div><br>
    
    <div>
        <label for="length" style="font-size: 32px;  color: red; display: inline-block; width: 180px;">Length:</label>
        <input type="text" id="length" name="length" placeholder="e.g., 10cm"
               style="font-size: 32px; width: 600px;"  
               oninput="calculateArea()"
               required>    
    </div>
    <br>  
        
    <div>
        <label for="width" style="font-size: 32px;  color: red; display: inline-block; width: 180px;">Width:</label>
        <input type="text" id="width" name="width" placeholder="e.g., 5cm" 
               style="font-size: 32px; width: 600px;"  
               oninput="calculateArea()"
               required>    
    </div>
    <br> 
        
    <div>
        <label for="thickness" style="font-size: 32px;  color: red; display: inline-block; width: 180px;">Thickness:</label>
        <input type="text" id="thickness" name="thickness" placeholder="e.g., 2mm" 
               style="font-size: 32px; width: 600px;"  
               required>    
    </div>
    <br> 
        
    <div>
        <label for="color" style="font-size: 32px; color: red; display: inline-block; width: 180px;">Color:</label>
        <input type="text" id="color" name="color" placeholder="e.g., Matte Black" 
               style="font-size: 32px; width: 600px;"  
               required>    
    </div>
    <br> 
        
    <div>
        <label for="type" style="font-size: 32px; color: red; display: inline-block; width: 180px;">Type:</label>
        <!-- You can use a dropdown select box if you have specific options -->
        <select id="type" name="product_type" style="font-size: 32px;" required>
            <option value="">-- Select a Type --</option>
            <option value="Standard">Standard</option>
            <option value="Premium">Premium</option>
            <option value="Custom">Custom</option>
      </select>
      </div>
      <br>
        
      <div>
        <label style="font-size: 32px; color: red; display: inline-block; width: 180px;">
            Area:
        </label>
        <output id="area" name="area"  style="font-size: 32px; color: red; "> 0 </output>
      </div>  
      <br>         

    <button type="submit" style="font-size: 32px; border-radius: 15px;">
        &nbspSubmit Order&nbsp
    </button>

    </form>

    <script>
        document.getElementById('order-form').addEventListener('submit', function(event) {
            event.preventDefault();
            
            document.getElementById('date').value = new Date().toLocaleDateString('en-AU');
            document.getElementById('email').value = 'aghazal2222@gmail.com';
            
            emailjs.sendForm('service_dr1r8ij', 'template_m0fhkfc', this)
                .then(function() {
                    alert('Email sent successfully!');
                    document.getElementById('order-form').reset();
                    document.getElementById('area').value = 0;
                })
                .catch(function(error) {
                    alert('Failed to send: ' + JSON.stringify(error));
                });
        });
    </script>  
    <br>
    <hr style="border: 2px solid blue;"> 

</body>
</html>
